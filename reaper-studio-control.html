<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#17120e">
<title>REAPER — Studio Control</title>
<script src="main.js"></script>
<style>
/* ===== REAPER Studio Control v5 =====
   Compatibilita': iOS Safari 10.3+ (iPad Air 1), Android Chrome / WebView recenti.
   Regole seguite: niente gap nei flex, grid-gap accanto a gap, niente display:contents,
   JavaScript ES5, fader disegnati a mano (nessun input range ruotato). */

/* --- temi: ogni tema ridefinisce soltanto queste variabili --- */
body{--bg:#17120e;--bg2:#3a2a1c;--panel:#261d16;--panel2:#32261c;--line:#5a4837;--muted:#a08c76;--text:#f1e4cf;
 --accent:#e8a33d;--accentbg:#4d3412;--accenttx:#ffd48a;--btn:#33271d;--btnact:#4a3825;
 --cap1:#f0e2c8;--cap2:#8d7a58;--capline:#2a1d10;--rail:#0d0907;--count:#f6c46b}
body.theme-grafite{--bg:#101419;--bg2:#2a3943;--panel:#1a2027;--panel2:#27313b;--line:#46515c;--muted:#8d9aa6;--text:#edf2f6;
 --accent:#79dfb1;--accentbg:#244b3d;--accenttx:#a8f2cf;--btn:#28323c;--btnact:#3b4956;
 --cap1:#aab4bd;--cap2:#3a444e;--capline:#0e1318;--rail:#0b1015;--count:#e5ebf0}
body.theme-chiaro{--bg:#dedad2;--bg2:#f4f1ea;--panel:#f1eee8;--panel2:#fbfaf7;--line:#b3ac9f;--muted:#6f6a61;--text:#1f1d1a;
 --accent:#b5651d;--accentbg:#f0d2aa;--accenttx:#5e2e04;--btn:#fbfaf7;--btnact:#dcd6ca;
 --cap1:#6a655d;--cap2:#2a2825;--capline:#f1eee8;--rail:#c9c2b5;--count:#1f1d1a}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);background:radial-gradient(ellipse at 50% -20%,var(--bg2) 0,var(--bg) 62%);color:var(--text);
 font:14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
input,textarea{-webkit-user-select:text;user-select:text}
button{cursor:pointer;border:1px solid var(--line);background:var(--btn);border-radius:5px;padding:0;margin:0;touch-action:manipulation}
button:active{background:var(--btnact)}
button.active{background:var(--accentbg);border-color:var(--accent);color:var(--accenttx)}
svg{display:block;fill:currentColor;pointer-events:none}

#app{display:flex;flex-direction:column;height:100%}
.top{flex:none;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.22)}
.brand{display:flex;align-items:center;font-weight:700;letter-spacing:.12em;min-width:0;white-space:nowrap}
.brandmark{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--bg);text-align:center;line-height:26px;font-weight:900;margin-right:10px}
.sub{font-size:10px;color:var(--muted);letter-spacing:.15em}
.topright{display:flex;align-items:center;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:#777;margin-right:7px}
.dot.ok{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.conntext{color:var(--muted);font-size:11px;margin-right:12px;white-space:nowrap}
.seg{display:flex;margin-right:8px}
.seg button{height:32px;padding:0 10px;font-size:11px;letter-spacing:.06em;border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:5px 0 0 5px;margin-left:0}
.seg button:last-child{border-radius:0 5px 5px 0}
.iconbtn{width:36px;height:32px;display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:20px;height:20px}

main{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px}

/* --- contatore --- */
.counter{flex:none;display:flex;align-items:center;justify-content:center;padding:4px 10px;margin-bottom:8px;min-height:48px}
.pos{font-family:"Barlow","Avenir Next","Helvetica Neue",Roboto,sans-serif;font-weight:500;font-size:34px;line-height:1.1;
 letter-spacing:.05em;font-variant-numeric:tabular-nums;color:var(--count);white-space:nowrap}
.pos .sep{color:var(--muted);margin:0 .35em}
body.cnt-time #posBeat,body.cnt-time .sep,body.cnt-beat #posTime,body.cnt-beat .sep{display:none}
.miniT{display:none;margin-left:auto}
.miniT button{width:44px;height:38px;margin-left:5px;display:flex;align-items:center;justify-content:center}
.miniT svg{width:20px;height:20px}
body.view-mixer .counter{justify-content:flex-start}
body.view-mixer .miniT{display:flex}
body.view-mixer .pos{font-size:26px}

/* --- area di lavoro: tastierino e mixer --- */
.work{flex:1;min-height:0;display:flex;flex-direction:column}
.keys{display:grid;grid-auto-flow:dense;grid-auto-rows:minmax(54px,1fr);grid-gap:8px;gap:8px;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.key{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:0;padding:4px;border-radius:7px;overflow:hidden}
.key svg{width:32px;height:32px;margin-bottom:6px;flex:none}
.key.big{grid-row:span 2}
.key.big svg{width:54px;height:54px}
.lbl{display:block;max-width:100%;font-size:10px;line-height:1.1;letter-spacing:.12em;text-transform:uppercase;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec{color:#ff7a5c}
.rec.active{background:#7a2318;border-color:#e0583a;color:#ffd0c4}
.rec.ask{background:#7a2318;border-color:#ff7a5c;color:#fff}
.pausekey.active{background:#7a5c12;border-color:#d1a23c;color:#ffe9ae}

.mixer{display:flex;min-height:0;overflow:hidden}
.strips{flex:1;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:6px;min-width:0}
.empty{color:var(--muted);font-size:12px;padding:14px;align-self:center}

body.view-keys .keys{flex:1}
body.view-keys .mixer{flex:none;margin-top:8px}
body.view-keys.no-strip .mixer{display:none}
body.view-mixer .keys{display:none}
body.view-mixer .mixer{flex:1}
body.view-both .mixer{flex:1 1 56%;order:1}
body.view-both .keys{flex:1 1 44%;order:2;margin-top:8px}
@media (orientation:landscape){
 body.view-both .work{flex-direction:row}
 body.view-both .keys{flex:0 0 40%;order:1;margin:0 8px 0 0}
 body.view-both .mixer{flex:1;order:2;min-width:0}
}

/* --- striscia di canale --- */
.strip{flex:none;width:84px;display:flex;flex-direction:column;min-height:0;margin-right:5px;padding:5px 4px;background:var(--panel2);border:1px solid var(--line);border-radius:6px}
body.sw-s .strip{width:64px}
body.sw-l .strip{width:108px}
.strip.sel{border-color:var(--accent)}
.strip.master{position:-webkit-sticky;position:sticky;left:0;z-index:3;box-shadow:4px 0 10px rgba(0,0,0,.35)}
.sarm{flex:none;height:30px;margin-bottom:4px;font-size:12px;font-weight:700}
.sarm.active{background:#7a2318;border-color:#e0583a;color:#ffd0c4}
/* pan: una manopola in modalita' balance, due in stereo pan (pan + width) e in dual pan (sinistro + destro) */
.knobwrap{flex:none;display:flex;margin-bottom:4px}
.kc{flex:1;min-width:0;text-align:center;touch-action:none}
.kc2{display:none}
.strip.pm2 .kc2{display:block}
.knob{position:relative;width:32px;height:32px;margin:0 auto;border-radius:50%;background:var(--btn);border:1px solid var(--line)}
body.sw-s .strip.pm2 .knob{width:25px;height:25px}
body.sw-s .strip.pm2 .knobi:after{height:8px}
.kc.drag .knob{border-color:var(--accent)}
.knobi{position:absolute;left:0;top:0;width:100%;height:100%}
.knobi:after{content:"";position:absolute;left:50%;top:3px;width:3px;height:11px;margin-left:-1.5px;border-radius:2px;background:var(--accent)}
.panv{font-size:9px;color:var(--muted);line-height:1.5;white-space:nowrap}
.sbtns{flex:none;display:flex}
.sbtns button{flex:1;min-width:0;height:36px;font-size:13px;font-weight:700;border-radius:4px}
.sbtns button+button{margin-left:3px}
body.sw-s.view-mixer .sbtns,body.sw-s.view-both .sbtns{flex-direction:column}
body.sw-s.view-mixer .sbtns button,body.sw-s.view-both .sbtns button{flex:none;height:32px}
body.sw-s.view-mixer .sbtns button+button,body.sw-s.view-both .sbtns button+button{margin:3px 0 0}
.bM.active{background:#8a3d2c;border-color:#d9783f;color:#ffd0bd}
.bS.active{background:#7a5c12;border-color:#d1a23c;color:#ffe9ae}

.fader{position:relative;flex:1;min-height:96px;margin:4px 0;touch-action:none}
.travel{position:absolute;top:24px;bottom:24px;left:0;right:0}
.rail{position:absolute;top:-8px;bottom:-8px;left:46%;width:6px;margin-left:-3px;border-radius:3px;background:var(--rail);border:1px solid var(--line)}
.tick{position:absolute;left:1px;height:10px;margin-top:-5px;font-size:8px;line-height:10px;color:var(--muted);white-space:nowrap}
.tick.zero{color:var(--text);font-weight:700}
.thumb{position:absolute;left:46%;width:28px;height:44px;margin:-22px 0 0 -14px;border-radius:5px;border:1px solid var(--capline);
 background:var(--cap2);background:linear-gradient(180deg,var(--cap1) 0,var(--cap2) 100%);box-shadow:0 2px 5px rgba(0,0,0,.6)}
.thumb:after{content:"";position:absolute;left:3px;right:3px;top:50%;height:2px;margin-top:-1px;background:var(--capline)}
.fader.drag .thumb{border-color:var(--accent)}
.meter{position:absolute;top:-8px;bottom:-8px;right:4px;width:8px;border:1px solid var(--line);border-radius:2px;overflow:hidden;
 background:#3fae74;background:linear-gradient(to top,#3fae74 0,#9bd05f 66%,#e8c14e 84%,#e8584e 100%)}
.mcover{position:absolute;left:0;right:0;top:0;height:100%;background:var(--rail)}
.mpeak{position:absolute;left:0;right:0;height:2px;bottom:0;background:var(--text);opacity:.85}
.mpeak.clip{background:#ff4d4d;opacity:1}
body.no-meters .meter{display:none}
body.no-meters .rail,body.no-meters .thumb{left:58%}
.sdb{flex:none;text-align:center;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;margin-bottom:3px}
.sname{flex:none;font-size:10.5px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 3px;border-radius:3px;background:var(--btn)}
body.no-pan .knobwrap,body.no-arm .sarm{display:none}

/* vista Tasti: la striscia tracce si riduce a nome + M / S / R */
body.view-keys .strip{width:132px;flex-direction:row;flex-wrap:wrap;align-items:center}
body.view-keys .fader,body.view-keys .knobwrap,body.view-keys .sdb{display:none}
body.view-keys .sname{order:-1;flex:0 0 100%;margin-bottom:4px}
body.view-keys .sbtns{flex:1}
body.view-keys .sbtns button{height:40px}
body.view-keys .sarm{flex:0 0 32%;height:40px;margin:0 0 0 3px;order:2}
body.view-keys .strip.master{position:static;box-shadow:none}

/* --- pannelli sovrapposti --- */
.sheet{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.55)}
.sheet.open{display:block}
.card{position:absolute;top:0;right:0;bottom:0;width:440px;max-width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel);border-left:1px solid var(--line);padding:12px 14px 30px}
.card h2{font-size:15px;margin:0;letter-spacing:.06em}
.card h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;font-weight:600}
.cardhead{display:flex;align-items:center;justify-content:space-between}
.row{display:flex;align-items:center;justify-content:space-between;min-height:40px;border-bottom:1px solid var(--line)}
.row span{padding-right:10px}
.row select,.krow select,.krow input[type=text],.card textarea,.dlg input{background:var(--btn);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-height:34px}
.row input[type=checkbox],.krow input[type=checkbox]{width:22px;height:22px;flex:none}
.tbtn{padding:0 12px;min-height:36px;font-size:12px}
.krow{display:flex;align-items:center;flex-wrap:wrap;padding:5px 0;border-bottom:1px solid var(--line)}
.krow .kn{flex:none;width:20px;color:var(--muted);font-size:11px}
.krow select{flex:1;min-width:0}
.krow label{display:flex;align-items:center;font-size:11px;margin-left:8px}
.krow label input{margin-right:4px}
.krow .mini{width:32px;height:34px;margin-left:4px;font-size:14px}
.krow .cust{flex:0 0 100%;display:flex;padding:5px 0 0 20px}
.krow .cust input{flex:1;min-width:0}
.krow .cust input+input{margin-left:5px}
.card textarea{width:100%;height:84px;font:11px/1.3 ui-monospace,Menlo,Consolas,monospace;margin-bottom:6px}
.note{color:var(--muted);font-size:11px;line-height:1.4;margin:6px 0}
.btnrow{display:flex;flex-wrap:wrap}
.btnrow button{margin:0 6px 6px 0}
.dlg{position:absolute;left:50%;top:18%;width:320px;max-width:92%;margin-left:-160px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
@media(max-width:340px){.dlg{left:4%;margin-left:0}}
.dlg input{width:100%;margin:8px 0;font-size:18px}

@media(min-width:700px){
 .pos{font-size:52px}
 .key svg{width:42px;height:42px;margin-bottom:9px}
 .key.big svg{width:76px;height:76px}
 .lbl{font-size:12px}
 .counter{min-height:66px}
}
@media(max-width:560px){.conntext{display:none}.sub{display:none}.seg button{padding:0 8px}}
@media(max-width:560px){
 body.view-mixer .counter{flex-wrap:wrap;justify-content:center}
 body.view-mixer .miniT{flex:0 0 100%;margin:4px 0 2px}
 body.view-mixer .miniT button{flex:1;margin:0 3px}
}
body.view-both .lbl{letter-spacing:.03em}
/* schermi bassi (telefono in orizzontale): si stringe tutto cio' che non e' il fader */
@media(max-height:480px){
 .top{height:38px}
 .counter{min-height:40px;margin-bottom:6px}
 main{padding:6px}
 .sarm{height:24px;margin-bottom:3px}
 .sbtns button{height:28px}
 .knob,body.sw-s .strip.pm2 .knob{width:24px;height:24px}
 .knobi:after{height:7px}
 .panv,.tick{display:none}
 .fader{min-height:70px;margin:3px 0}
 .travel{top:17px;bottom:17px}
 .thumb{height:30px;margin-top:-15px}
 .sdb{margin-bottom:2px}
}
@media(max-width:380px){.brandtx{display:none}}
</style>
</head>
<body class="theme-ambra view-mixer">
<div id="app">
<header class="top">
 <div class="brand"><div class="brandmark">R</div><div class="brandtx">REAPER <span class="sub">/ STUDIO CONTROL</span></div></div>
 <div class="topright">
  <span class="dot" id="connDot"></span><span class="conntext" id="connText">In attesa di REAPER</span>
  <div class="seg" id="viewSeg"><button data-view="keys">Tasti</button><button data-view="mixer">Mixer</button><button data-view="both">Entrambi</button></div>
  <button class="iconbtn" id="gearBtn" title="Impostazioni"><svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 12h2M12 12h8M4 17h10M20 17h0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.6"/><circle cx="9" cy="12" r="2.6"/><circle cx="17" cy="17" r="2.6"/></svg></button>
 </div>
</header>
<main>
 <div class="panel counter">
  <div class="pos"><span id="posTime">00:00</span><span class="sep">·</span><span id="posBeat">1.1.00</span></div>
  <div class="miniT" id="miniT"></div>
 </div>
 <div class="work">
  <div class="keys" id="keys"></div>
  <div class="panel mixer"><div class="strips" id="strips"></div></div>
 </div>
</main>
</div>

<div class="sheet" id="settings"><div class="card" id="settingsCard"></div></div>
<div class="sheet" id="gotoDlg"><div class="dlg">
 <strong>Vai a…</strong>
 <input type="text" id="gotoIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="1:02.500">
 <div class="note">Tempo (1:02.500) oppure battuta (12.1.00).</div>
 <div class="btnrow"><button class="tbtn active" id="gotoOk">Vai</button><button class="tbtn" id="gotoNo">Annulla</button></div>
</div></div>

<script>
(function(){
'use strict';

/* ============================================================
   1. CATALOGO DELLE AZIONI
   id = Command ID di REAPER (Actions > Show action list).
   tg = azione con stato acceso/spento, da interrogare con GET.
   Per aggiungere un'azione al menu basta una riga qui e, se serve, un'icona in ICON.
   ============================================================ */
var CAT={
 start:{id:40042,l:'Inizio'},
 end:{id:40043,l:'Fine'},
 stop:{id:40667,l:'Stop'},
 pause:{id:1008,l:'Pausa'},
 play:{id:1007,l:'Play'},
 playstop:{id:40044,l:'Play/Stop'},
 rec:{id:1013,l:'Rec'},
 back:{id:41043,l:'Indietro',t:'Cursore indietro di una battuta'},
 fwd:{id:41042,l:'Avanti',t:'Cursore avanti di una battuta'},
 repeat:{id:1068,l:'Repeat'},
 undo:{id:40029,l:'Undo'},
 redo:{id:40030,l:'Redo'},
 metro:{id:40364,l:'Metronomo',tg:1},
 snap:{id:1157,l:'Snap',tg:1},
 mprev:{id:40172,l:'Marker prec.'},
 mnext:{id:40173,l:'Marker succ.'},
 addmarker:{id:40157,l:'Nuovo marker'},
 save:{id:40026,l:'Salva'},
 'goto':{id:0,l:'Vai a…'}
};
var MARKER='<path d="M9.6 7.3v9.4a.5.5 0 0 1-.78.42L2.9 12.4a.5.5 0 0 1 0-.8l5.92-4.72a.5.5 0 0 1 .78.42z"/><rect x="14.6" y="4" width="1.8" height="16" rx=".9"/><path d="M16.4 4.6h4.4a.4.4 0 0 1 .33.63L19.6 7.9l1.53 2.67a.4.4 0 0 1-.33.6h-4.4z"/>';
var START='<rect x="3.5" y="5" width="3" height="14" rx="1"/><path d="M20.5 5.2v13.6a.6.6 0 0 1-.95.5L9 12.5a.6.6 0 0 1 0-1l10.55-6.8a.6.6 0 0 1 .95.5z"/>';
var FLIP='<g transform="translate(24 0) scale(-1 1)">';
var ICON={
 start:START,
 end:FLIP+START+'</g>',
 stop:'<rect x="5.5" y="5.5" width="13" height="13" rx="2.4"/>',
 pause:'<rect x="5.5" y="4.5" width="4.6" height="15" rx="1.6"/><rect x="13.9" y="4.5" width="4.6" height="15" rx="1.6"/>',
 play:'<path d="M7.5 4.9v14.2a.9.9 0 0 0 1.38.76l11-7.1a.9.9 0 0 0 0-1.52l-11-7.1A.9.9 0 0 0 7.5 4.9z"/>',
 playstop:'<path d="M2.8 6.2v11.6a.7.7 0 0 0 1.1.58l8.3-5.8a.7.7 0 0 0 0-1.16L3.9 5.62a.7.7 0 0 0-1.1.58z"/><rect x="14.4" y="7.6" width="7" height="8.8" rx="1.4"/>',
 rec:'<circle cx="12" cy="12" r="7.6"/>',
 back:'<path d="M12.8 5.6v12.8a.6.6 0 0 1-.93.5L3.1 12.5a.6.6 0 0 1 0-1l8.77-6.4a.6.6 0 0 1 .93.5z"/><path d="M21.4 5.6v12.8a.6.6 0 0 1-.93.5l-8.77-6.4a.6.6 0 0 1 0-1l8.77-6.4a.6.6 0 0 1 .93.5z"/>',
 fwd:'<path d="M11.2 5.6v12.8a.6.6 0 0 0 .93.5l8.77-6.4a.6.6 0 0 0 0-1l-8.77-6.4a.6.6 0 0 0-.93.5z"/><path d="M2.6 5.6v12.8a.6.6 0 0 0 .93.5l8.77-6.4a.6.6 0 0 0 0-1L3.53 5.1a.6.6 0 0 0-.93.5z"/>',

/* Legge del fader: vol=(p/P0)^4, dove P0 e' la posizione di 0 dB.
   Con fondo scala +12 dB lo 0 dB cade al 71% della corsa; in basso il fader arriva a -inf. */
function p0(){return Math.pow(10,-cfg.maxdb/80);}
function volToPos(v){return v>0?clamp(p0()*Math.pow(v,0.25),0,1):0;}
function posToVol(p){return p<=0.002?0:Math.pow(p/p0(),4);}

function updateTracks(all){

 for(i=0;i<all.length;i++)if(visible(all[i]))list.push(all[i]);

 if(order!==stripOrder){
  stripOrder=order;stripsEl.innerHTML='';
  var old=S;S={};
  for(i=0;i<list.length;i++){s=old[list[i].id]||buildStrip(list[i]);S[list[i].id]=s;stripsEl.appendChild(s.el);}
  if(!list.length)stripsEl.innerHTML='<div class="empty">Nessuna traccia da mostrare.</div>';

 if(L.name!==nm){L.name=nm;s.name.textContent=nm;s.name.title=nm;}
 c=cfg.colors?(t.color&0xffffff):0;

  if(c){var r=c>>16&255,g=c>>8&255,b=c&255;s.name.style.background='rgb('+r+','+g+','+b+')';s.name.style.color=(r*299+g*587+b*114>140000)?'#111':'#fff';}
  else{s.name.style.background='';s.name.style.color='';}}

 if(free&&L.vol!==t.vol){L.vol=t.vol;setVolUI(s,t.vol);}
 if(L.pm!==t.pm){L.pm=t.pm;tog(s.el,'pm2',t.pm!==3);L.pan=L.pan2=null;
  s.panv[0].parentNode.title=t.pm===6?'Pan del canale sinistro':(t.pm===5?'Pan':'Balance');
  s.panv[1].parentNode.title=t.pm===6?'Pan del canale destro':'Width';}
 if(free&&L.pan!==t.pan){L.pan=t.pan;setPanUI(s,'pan',t.pan);}
 if(free&&t.pm!==3&&L.pan2!==t.pan2){L.pan2=t.pan2;setPanUI(s,'pan2',t.pan2);}

  v=meterPct(t.pos);if(L.pos!==v){L.pos=v;s.cover.style.height=(100-v).toFixed(1)+'%';}

}

stripsEl.addEventListener('click',function(e){

 if(!c)return;

 b.classList.toggle('active');if(S[id])S[id].L.flags=-1;
 cmd('SET/TRACK/'+id+'/'+c+'/-1;TRACK');

/* --- trascinamento di fader e manopole pan ---
   Il gesto e' relativo: toccare il fader non lo fa saltare, si muove di quanto si muove il dito.
   Le manopole si muovono in verticale, come in REAPER; mentre si girano il valore compare al posto dei dB.
   Il doppio tocco riporta al valore di partenza: 0 dB, pan al centro, width 100%, dual pan tutto a sinistra e tutto a destra.
   Se il primo movimento e' orizzontale il gesto fa scorrere il mixer. */
var drags={map:{},busy:{}},lastTap={};
function findDrag(node){while(node&&node!==stripsEl){if(node.getAttribute&&node.getAttribute('data-d'))return node;node=node.parentNode;}return null;}
function dragStart(key,node,x,y){
 var st=node.parentNode,id,s,type=node.getAttribute('data-d'),tk,t=now(),v;
 while(st&&!st.getAttribute('data-id'))st=st.parentNode;if(!st)return false;
 id=st.getAttribute('data-id');s=S[id];tk=id+type;
 if(!s)return false;
 if(lastTap[tk]&&t-lastTap[tk]<350){lastTap[tk]=0;
  if(type==='vol'){s.L.vol=1;setVolUI(s,1);cmd('SET/TRACK/'+id+'/VOL/1;SET/UNDO/Volume traccia (web)');}
  else{v=type==='pan2'?1:(s.L.pm===6?-1:0);s.L[type]=v;setPanUI(s,type,v);cmd('SET/TRACK/'+id+SETPATH[type]+v+';SET/UNDO/Pan traccia (web)');}
  hold[id]=t+700;return true;}
 drags.map[key]={id:id,s:s,type:type,node:node,x:x,y:y,lock:'',moved:false,sent:0,
  start:type==='vol'?volToPos(s.L.vol||0):(s.L[type]||0),val:null,
  h:type==='vol'?(node.querySelector('.travel').offsetHeight||200):150,scroll:stripsEl.scrollLeft};

}

  d.lock=Math.abs(dy)>=Math.abs(dx)?'v':'h';d.moved=true;
  if(d.lock==='v'){drags.busy[d.id]=(drags.busy[d.id]||0)+1;tog(d.node,'drag',true);}}
 if(d.lock==='h'){stripsEl.scrollLeft=d.scroll-dx;return true;}
 if(d.type==='vol'){p=clamp(d.start-dy/d.h,0,1);v=posToVol(p);d.val=v;d.s.L.vol=v;
  d.s.thumb.style.top=((1-p)*100).toFixed(2)+'%';d.s.db.textContent=dbText(v);}
 else{v=clamp(d.start-dy/d.h*2,-1,1);if(Math.abs(v)<0.03)v=0;d.val=v;d.s.L[d.type]=v;setPanUI(d.s,d.type,v);d.s.db.textContent=knobText(d.type,v,d.s.L.pm);}
 if(now()-d.sent>45){d.sent=now();sendDrag(d);}
 return true;
}
var SETPATH={vol:'/VOL/',pan:'/PAN/',pan2:'/WIDTH/'};   /* WIDTH porta la width oppure, in dual pan, il pan destro */
function sendDrag(d){cmd('SET/TRACK/'+d.id+SETPATH[d.type]+d.val.toFixed(5));}

 drags.busy[d.id]--;tog(d.node,'drag',false);hold[d.id]=now()+700;
 if(d.type!=='vol')d.s.db.textContent=dbText(d.s.L.vol);
 if(d.val!==null){sendDrag(d);cmd('SET/UNDO/'+(d.type==='vol'?'Volume':'Pan')+' traccia (web)');}
}
var touchOpt=false;try{window.addEventListener('test',null,Object.defineProperty({},'passive',{get:function(){touchOpt={passive:false};}}));}catch(e){}
stripsEl.addEventListener('touchstart',function(e){
 var i,t,n,hit=false;
 for(i=0;i<e.changedTouches.length;i++){t=e.changedTouches[i];n=findDrag(t.target);
  if(n&&dragStart('t'+t.identifier,n,t.clientX,t.clientY))hit=true;}
 if(hit&&e.cancelable)e.preventDefault();
},touchOpt);
stripsEl.addEventListener('touchmove',function(e){
 var i,t,hit=false;
 for(i=0;i<e.changedTouches.length;i++){t=e.changedTouches[i];if(dragMove('t'+t.identifier,t.clientX,t.clientY))hit=true;}
 if(hit&&e.cancelable)e.preventDefault();
},touchOpt);
function touchEnd(e){for(var i=0;i<e.changedTouches.length;i++)dragEnd('t'+e.changedTouches[i].identifier);}
stripsEl.addEventListener('touchend',touchEnd);
stripsEl.addEventListener('touchcancel',touchEnd);

   8. IMPOSTAZIONI
   ============================================================ */
var card=$('settingsCard');
function sel(key,opts){var h='<select data-k="'+key+'">',i;for(i=0;i<opts.length;i++)h+='<option value="'+opts[i][0]+'"'+(String(cfg[key])===String(opts[i][0])?' selected':'')+'>'+opts[i][1]+'</option>';return h+'</select>';}
function chk(key){return '<input type="checkbox" data-k="'+key+'"'+(cfg[key]?' checked':'')+'>';}
function row(label,ctl){return '<label class="row"><span>'+label+'</span>'+ctl+'</label>';}
function renderSettings(){
 var h='<div class="cardhead"><h2>Impostazioni</h2><button class="tbtn active" data-act="close">Chiudi</button></div>',i,k,a,fs=document.documentElement;
 h+='<h3>Aspetto</h3>';
 h+=row('Vista',sel('view',[['keys','Tasti'],['mixer','Mixer'],['both','Entrambi']]));
 h+=row('Tema',sel('theme',[['ambra','Tape Ambra'],['grafite','Grafite'],['chiaro','Chiaro']]));
 h+=row('Contatore',sel('counter',[['both','Tempo e battute'],['time','Solo tempo'],['beat','Solo battute']]));
 h+='<h3>Mixer</h3>';
 h+=row('Larghezza delle strisce',sel('sw',[['s','Stretta'],['m','Media'],['l','Larga']]));
 h+=row('Fondo scala del fader',sel('maxdb',[[12,'+12 dB'],[6,'+6 dB']]));
 h+=row('Master',chk('master'));
 h+=row('Meter',chk('meters'));
 h+=row('Controlli di pan',chk('pan'));
 h+=row('Pulsante Rec arm',chk('arm'));
 h+=row('Colori delle tracce',chk('colors'));
 h+=row('Mostra le tracce nascoste dal mixer',chk('hidden'));
 h+='<h3>Tastierino</h3>';
 h+=row('Colonne',sel('cols',[[3,'3'],[4,'4'],[5,'5'],[6,'6']]));
 h+=row('Striscia tracce M / S / R sotto i tasti',chk('strip'));
 h+=row('Rec richiede un secondo tocco',chk('recConfirm'));
 h+='<h3>Tasti</h3>';
 for(i=0;i<cfg.keys.length;i++){k=cfg.keys[i];
  h+='<div class="krow"><span class="kn">'+(i+1)+'</span><select data-ki="'+i+'" data-f="a">';
  for(a in CAT)if(CAT.hasOwnProperty(a))h+='<option value="'+a+'"'+(k.a===a?' selected':'')+'>'+esc(CAT[a].l)+'</option>';
  h+='<option value="custom"'+(k.a==='custom'?' selected':'')+'>Azione personalizzata…</option></select>';
  h+='<label><input type="checkbox" data-ki="'+i+'" data-f="big"'+(k.big?' checked':'')+'>Grande</label>';
  h+='<button class="mini" data-act="up" data-ki="'+i+'">↑</button><button class="mini" data-act="down" data-ki="'+i+'">↓</button><button class="mini" data-act="del" data-ki="'+i+'">✕</button>';
  if(k.a==='custom')h+='<div class="cust"><input type="text" data-ki="'+i+'" data-f="id" placeholder="Command ID" value="'+esc(k.id||'')+'" autocapitalize="off" autocorrect="off" spellcheck="false"><input type="text" data-ki="'+i+'" data-f="l" placeholder="Etichetta" value="'+esc(k.l||'')+'"></div>';
  h+='</div>';}
 h+='<div class="note">Il Command ID si legge in REAPER, nella lista delle azioni (clic destro sull\'azione, «Copy selected action command ID»). Funzionano anche gli ID testuali degli script, che cominciano con il trattino basso.</div>';
 h+='<div class="btnrow"><button class="tbtn" data-act="add">Aggiungi un tasto</button><button class="tbtn" data-act="keysreset">Ripristina i tasti</button></div>';
 h+='<h3>Configurazione</h3><div class="note">Le impostazioni restano su questo dispositivo. Per portarle su un altro, copiare il testo qui sotto e incollarlo nella stessa casella dell\'altro dispositivo.</div>';
 h+='<textarea id="cfgText" autocapitalize="off" autocorrect="off" spellcheck="false">'+esc(JSON.stringify(cfg))+'</textarea>';
 h+='<div class="btnrow"><button class="tbtn" data-act="import">Applica il testo</button><button class="tbtn" data-act="reset">Ripristina tutto</button>';
 if(fs.requestFullscreen||fs.webkitRequestFullscreen)h+='<button class="tbtn" data-act="full">Schermo intero</button>';
 h+='</div>';
 var top=card.scrollTop;card.innerHTML=h;card.scrollTop=top;
}
function closeSettings(){tog($('settings'),'open',false);if(needReload)location.reload();}
card.addEventListener('change',function(e){
 var t=e.target,k=t.getAttribute('data-k'),ki=t.getAttribute('data-ki'),f=t.getAttribute('data-f'),v;
 if(k){v=t.type==='checkbox'?(t.checked?1:0):t.value;if(typeof cfg[k]==='number')v=+v;cfg[k]=v;saveCfg();applyCfg();return;}
 if(ki!==null&&f){ki=+ki;
  if(f==='a'){cfg.keys[ki].a=t.value;}
  else if(f==='big'){if(t.checked)cfg.keys[ki].big=1;else delete cfg.keys[ki].big;}
  else{cfg.keys[ki][f]=t.value.replace(/^\s+|\s+$/g,'');}
  saveCfg();applyCfg();if(f==='a')renderSettings();}
});
card.addEventListener('click',function(e){
 var t=e.target,a=t.getAttribute&&t.getAttribute('data-act'),i=+t.getAttribute('data-ki'),k=cfg.keys,x,fs;
 if(!a)return;
 if(a==='close'){closeSettings();return;}
 if(a==='full'){fs=document.documentElement;
  if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
  else(fs.requestFullscreen||fs.webkitRequestFullscreen).call(fs);return;}
 if(a==='up'&&i>0){x=k[i];k[i]=k[i-1];k[i-1]=x;}
 else if(a==='down'&&i<k.length-1){x=k[i];k[i]=k[i+1];k[i+1]=x;}
 else if(a==='del'){k.splice(i,1);}
 else if(a==='add'){k.push({a:'save'});}
 else if(a==='keysreset'){cfg.keys=defaults().keys;}
 else if(a==='reset'){cfg=defaults();}
 else if(a==='import'){try{cfg=mergeCfg(defaults(),JSON.parse($('cfgText').value));}catch(err){$('cfgText').value='Testo non valido: '+err.message;return;}}
 saveCfg();applyCfg();renderSettings();
});
$('settings').addEventListener('click',function(e){if(e.target===this)closeSettings();});
$('gearBtn').addEventListener('click',function(){renderSettings();tog($('settings'),'open',true);});
$('viewSeg').addEventListener('click',function(e){var v=e.target.getAttribute('data-view');if(v){cfg.view=v;saveCfg();applyCfg();}});

var lastMaxdb=null;
function applyCfg(){
 var b=document.body,seg=$('viewSeg').children,i,id;
 b.className='theme-'+cfg.theme+' view-'+cfg.view+' sw-'+cfg.sw+' cnt-'+cfg.counter+
  (cfg.meters?'':' no-meters')+(cfg.pan?'':' no-pan')+(cfg.arm?'':' no-arm')+(cfg.strip?'':' no-strip');
 for(i=0;i<seg.length;i++)tog(seg[i],'active',seg[i].getAttribute('data-view')===cfg.view);
 renderKeys();
 if(lastMaxdb!==cfg.maxdb){lastMaxdb=cfg.maxdb;S={};}     /* la scala cambia: le strisce vanno ricostruite */
 stripOrder='?';for(id in S)if(S.hasOwnProperty(id))S[id].L={};
 setupPolling();
 if(tracksWanted())cmd('TRACK');
}

   10. MODALITA' DEMO

var DT=[{n:'MASTER',f:0,v:1,p:0,w:1,m:3,c:0},{n:'Trombone',f:2,v:0.71,p:0,w:1,m:3,c:0x01c8642d},{n:'Pianoforte preparato',f:0,v:1,p:-0.2,w:0.6,m:5,c:0x012d7fc8},
 {n:'Timpano',f:8,v:0.5,p:0.3,w:1,m:3,c:0},{n:'Elettronica',f:16,v:1.4,p:-1,w:1,m:6,c:0x0159a14f},{n:'Nastro',f:0,v:1.4,p:-0.4,w:0.7,m:6,c:0x0159a14f},
 {n:'Room',f:64,v:0.25,p:0,w:1,m:5,c:0},{n:'Riverbero',f:0,v:0.6,p:0,w:1,m:0,c:0x018a5fb0}],dPos=0,dPs=0,dRep=0,dCmd={},dLast=now();
function demoCmd(q){
 var parts=q.split(';'),out='',i,m,t,k,bit,tt=now();
 if(dPs===1||dPs===5)dPos+=(tt-dLast)/1000;dLast=tt;
 for(i=0;i<parts.length;i++){k=parts[i];
  if(k==='TRANSPORT'){var bt=dPos*2;out+='TRANSPORT\t'+dPs+'\t'+dPos.toFixed(3)+'\t'+dRep+'\t'+dPos.toFixed(3)+'\t'+(Math.floor(bt/4)+1)+'.'+(Math.floor(bt%4)+1)+'.'+pad2(bt%1*100)+'\n';}
  else if(k==='TRACK'){for(m=0;m<DT.length;m++){t=DT[m];
   var lvl=(dPs===1||dPs===5)&&!(t.f&8)?Math.round(200*Math.log(t.v*(0.15+Math.random()*0.5))/Math.LN10):-1500;
   out+='TRACK\t'+m+'\t'+t.n+'\t'+t.f+'\t'+t.v+'\t'+t.p+'\t'+(lvl+40)+'\t'+lvl+'\t'+t.w+'\t'+t.m+'\t0\t0\t1\t'+t.c+'\n';}}
  else if(k.indexOf('GET/')===0){out+='CMDSTATE\t'+k.substr(4)+'\t'+(dCmd[k.substr(4)]?1:0)+'\n';}
  else if((m=/^SET\/TRACK\/(\d+)\/(\w+)\/(.+)$/.exec(k))&&DT[+m[1]]){t=DT[+m[1]];
   if(m[2]==='VOL')t.v=parseFloat(m[3]);else if(m[2]==='PAN')t.p=parseFloat(m[3]);else if(m[2]==='WIDTH')t.w=parseFloat(m[3]);
   else{bit={MUTE:8,SOLO:16,RECARM:64}[m[2]];if(bit)t.f^=bit;}}
  else if(k==='1007')dPs=1;else if(k==='40667'){dPs=0;}else if(k==='1013')dPs=5;
  else if(k==='1008')dPs=dPs===1?2:(dPs===5?6:(dPs===2?1:(dPs===6?5:dPs)));
  else if(k==='40044')dPs=dPs===1||dPs===5?0:1;
  else if(k==='40042')dPos=0;else if(k==='41042')dPos+=2;else if(k==='41043')dPos=Math.max(0,dPos-2);
  else if(k==='1068')dRep=dRep?0:1;
  else if(/^[_\w]+$/.test(k))dCmd[k]=!dCmd[k];
 }
 if(out)setTimeout(function(){window.wwr_onreply(out);},0);
}
